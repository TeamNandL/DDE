# Stub for the vault-app HTTP BFF. No secrets in this file.
# Set the database URL at deploy time:
#   fly secrets set DATABASE_URL="postgresql://…"
#
# Deploy from the repository root so the Docker context can COPY vault/001_schema.sql.

app = "dde-vault-bff"
primary_region = "iad"

[build]
  dockerfile = "vault-app/Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
